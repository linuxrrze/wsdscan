  <rect x="34" y="56" width="60" height="18" fill="url(#beam)"/>
  <!-- scanner body -->
  <rect x="12" y="70" width="104" height="44" rx="10" fill="url(#body)"/>
  <rect x="12" y="70" width="104" height="8" rx="4" fill="#77767b"/>
